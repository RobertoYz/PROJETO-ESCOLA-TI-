<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecionar Startup - Anjo Nexus</title>
    <link rel="stylesheet" href="../estilos/layout.css">
</head>
<body>
    <div id="container-cabecalho" class="container-cabecalho">
        <div style="width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #4f46e5, #7c3aed); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4); margin-bottom: 6px;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                <polyline points="2 17 12 22 22 17"></polyline>
                <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
        </div>
        <h1>Selecione a Startup</h1>
        <p>Escolha a empresa para gerenciar editais e funil de submissão</p>
    </div>

    <div id="container-formulario" class="container-selecao-startup">
        <div class="barra-topo-startup">
            <input type="text" id="campo-busca-startup" placeholder="Buscar startup pelo nome...">
            <button type="button" id="botao-nova-startup">Criar Nova Startup</button>
        </div>

        <div id="mensagem-erro" class="texto-erro" hidden></div>

        <div id="lista-startups" class="lista-startups"></div>
    </div>

    <script type="module" src="../scripts/paginas/selecionarStartup.js"></script>
</body>
</html>
