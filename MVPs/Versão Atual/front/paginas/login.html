<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Anjo Nexus</title>
    <link rel="stylesheet" href="../estilos/layout.css">
</head>

<body>
    <div id="container-cabecalho" class="container-cabecalho">
        <h1 class="titulo-pagina">Login</h1>
        <a href="cadastro.html" class="link-alternar">Não possui uma conta? Cadastre-se</a>
    </div>

    <div id="container-formulario" class="container-formulario">
        <form id="formulario-login" class="formulario" novalidate>
            <div class="grupo-campo">
                <label for="campo-email" class="rotulo-campo">E-mail</label>
                <input type="email" id="campo-email" class="campo-entrada" placeholder="Seu e-mail cadastrado">
            </div>

            <div class="grupo-campo">
                <label for="campo-senha" class="rotulo-campo">Senha</label>
                <input type="password" id="campo-senha" class="campo-entrada" placeholder="Sua senha de acesso">
            </div>

            <button type="submit" id="botao-confirmar" class="botao-acao">Entrar</button>
        </form>

        <div id="mensagem-erro" class="texto-erro" hidden></div>
    </div>

    <script type="module" src="../scripts/paginas/login.js"></script>
</body>

</html>
