<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anjo Nexus - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --text-light: #ffffff;
            --text-muted: #a0a0a0;
            --accent-blue: #1b36ff;
            --accent-hover: #0d1ecc;
            --input-bg: #1c1c1c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        /* Navbar / Logo positionada */
        .navbar {
            position: absolute;
            top: 2rem;
            left: 5%;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 600;
        }
        .logo span {
            font-weight: 400;
        }

        /* Container Central */
        .login-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 2rem;
            text-align: center;
        }

        /* Formulário */
        .form-group {
            width: 100%;
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .form-group input {
            background-color: var(--input-bg);
            border: 1px solid transparent;
            padding: 14px 16px;
            border-radius: 12px;
            color: var(--text-light);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: #555;
        }

        .form-group input:focus {
            box-shadow: 0 0 0 2px var(--accent-blue);
        }

        /* Botão de Login */
        .btn-login {
            background-color: var(--accent-blue);
            color: var(--text-light);
            border: none;
            padding: 12px 40px;
            border-radius: 30px; /* Estilo pílula como na imagem */
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 0.5rem;
        }

        .btn-login:hover {
            background-color: var(--accent-hover);
        }

        /* Link Esqueci a Senha */
        .forgot-password {
            color: var(--accent-blue);
            text-decoration: underline;
            font-size: 0.85rem;
            margin-top: 1rem;
            font-weight: 500;
            background: none;
            border: none;
            cursor: pointer;
        }

        /* Divisor "ou" */
        .divider {
            display: flex;
            align-items: center;
            width: 100%;
            margin: 2rem 0;
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #444;
        }

        .divider:not(:empty)::before {
            margin-right: 1rem;
        }

        .divider:not(:empty)::after {
            margin-left: 1rem;
        }

        /* Botão Google */
        .btn-google {
            background-color: #ffffff;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 30px; /* Estilo pílula */
            width: 80%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-google:hover {
            opacity: 0.9;
        }

        .btn-google svg {
            width: 24px;
            height: 24px;
        }

    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">Anjo<span>Nexus</span></div>
    </div>

    <div class="login-container">
        <h2 class="login-title">Consultor</h2>
        
        <form style="width: 100%; display: flex; flex-direction: column; align-items: center;" id="loginForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="example@email.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit" class="btn-login">Login</button>
            <a href="#" class="forgot-password">Esqueci minha senha</a>
        </form>

        <div class="divider">ou</div>

        <button class="btn-google">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
        </button>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Redireciona o consultor para a tela de Seleção de Perfis/Dashboard após o login
            window.location.href = 'selecao_perfis_anjonexus.html';
        });
    </script>
</body>
</html>
