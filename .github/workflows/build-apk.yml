name: Build Android APK (Capacitor)

on:
  workflow_dispatch: # Permite disparar manualmente pelo botão "Run workflow" no GitHub
  push:
    branches:
      - EDTAN-178-modulo-mobile
      - main
      - master
    paths:
      - 'MVPs/Versão Atual/mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar ambiente Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'MVPs/Versão Atual/mobile/package-lock.json'

      - name: 3. Configurar ambiente Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Instalar dependências e Sincronizar Capacitor
        run: |
          cd "MVPs/Versão Atual/mobile"
          npm install
          npx cap sync android

      - name: 5. Compilar APK com Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd "MVPs/Versão Atual/mobile/android"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 6. Publicar arquivo APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: anjonexus-mobile-apk
          path: MVPs/Versão Atual/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
